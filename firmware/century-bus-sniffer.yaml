substitutions:
  device_name: century-bus-sniffer
  friendly_name: Century Bus Sniffer

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  # Keep the pump UART dedicated to capture. View logs through Wi-Fi/API.
  baud_rate: 0
  level: DEBUG
  tx_buffer_size: 2048

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: sniff_uart
  # Receive only: there is deliberately no tx_pin, Modbus component, or pump
  # component in this temporary image.
  rx_pin: GPIO1
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[PUMP BUS] "
    after:
      # At 9600 baud, 5 ms is longer than the Modbus RTU 3.5-character gap
      # and normally separates requests and replies into individual log lines.
      timeout: 5ms
      bytes: 64
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ', debug_prefix);
