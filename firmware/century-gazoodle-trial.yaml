# Upstream Gazoodle component, unchanged; separate from our adapted firmware.
# Build with ESPHome 2026.7.4. GPIO4 maintenance inhibit is NOT implemented here.
substitutions:
  device_name: century-gazoodle-trial
  friendly_name: Century Gazoodle Trial

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/gazoodle/CenturyVSPump
      ref: 0dafb0657ec63941440e8fbc63be7a07aca3265e
    components: [centuryvspump]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Century Trial Setup"
    password: !secret fallback_password

captive_portal:
logger:
  baud_rate: 0
  level: DEBUG
api:
ota:
  - platform: esphome

uart:
  id: pump_uart
  tx_pin: GPIO2
  rx_pin: GPIO1
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH

modbus:
  id: pump_bus
  uart_id: pump_uart

centuryvspump:
  id: pool_pump
  modbus_id: pump_bus
  address: 0x15

switch:
  - platform: centuryvspump
    id: pump_run
    name: Run
    restore_mode: ALWAYS_OFF

number:
  - platform: centuryvspump
    id: pump_speed
    name: Speed
    unit_of_measurement: rpm

sensor:
  - platform: centuryvspump
    name: Motor RPM
    type: rpm
    unit_of_measurement: rpm
  - platform: centuryvspump
    name: Requested RPM
    type: custom
    address: 3
    page: 0
    scale: 4
    unit_of_measurement: rpm
