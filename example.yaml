substitutions:
  device_name: century-pump-controller
  friendly_name: Century Pump

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESP32-S3 RS485 Century VSPump controller with LCD2004 and local scheduling"
  min_version: 2026.8.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/frank-nobrega/century-vspump-esphome
      ref: main
    components:
      - century_vspump

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Century Pump Setup"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: pool_time
    timezone: America/New_York

globals:
  # -2 means waiting for a valid schedule decision; -1 means scheduled off.
  - id: g_last_active_block
    type: int
    restore_value: false
    initial_value: '-2'

  - id: g_run_requested
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: g_requested_rpm
    type: int
    restore_value: false
    initial_value: '1500'

uart:
  id: pump_uart
  tx_pin: GPIO2
  rx_pin: GPIO1
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

i2c:
  id: display_bus
  sda: GPIO5
  scl: GPIO6
  scan: true
  frequency: 100kHz

modbus:
  id: pump_bus
  uart_id: pump_uart
  role: client
  send_wait_time: 150ms
  turnaround_time: 5ms

binary_sensor:
  - platform: gpio
    id: maintenance_inhibit
    name: Maintenance Inhibit
    device_class: safety
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      then:
        - lambda: |-
            if (x) {
              id(g_run_requested) = false;
              id(g_last_active_block) = -2;
            }

  - platform: template
    name: Run Requested
    id: run_requested
    entity_category: diagnostic
    lambda: |-
      return id(g_run_requested);

century_vspump:
  id: pool_pump
  modbus_id: pump_bus
  address: 0x15
  maintenance_input: maintenance_inhibit
  update_interval: 10s
  run:
    id: pump_run
    name: Run
    icon: mdi:pump
    restore_mode: ALWAYS_OFF
  speed:
    id: pump_speed_demand
    name: Speed
    unit_of_measurement: rpm
    icon: mdi:speedometer
    mode: slider
  motor_rpm:
    id: pump_motor_rpm
    name: Motor Speed
  motor_current:
    id: pump_motor_current
    name: Motor Current
  input_power:
    id: pump_input_power
    name: Input Power
  output_power:
    name: Shaft Output Power
    entity_category: diagnostic
  dc_bus_voltage:
    name: DC Bus Voltage
    entity_category: diagnostic
  drive_temperature:
    name: Drive Temperature
    entity_category: diagnostic
  fault_code:
    id: pump_fault_code
    name: Fault Code
    entity_category: diagnostic
  status:
    id: pump_status
    name: Status


switch:
  - platform: template
    name: Manual Override
    id: manual_override
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - lambda: |-
          id(g_last_active_block) = -2;
          id(g_run_requested) = false;

  - platform: template
    name: Pump Schedule Enabled
    id: schedule_master_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Schedule Block 1 Enabled
    id: block1_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Schedule Block 2 Enabled
    id: block2_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Schedule Block 3 Enabled
    id: block3_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Schedule Block 4 Enabled
    id: block4_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: Schedule End Enabled
    id: schedule_end_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: template
    name: Pump Start and Apply RPM
    on_press:
      - switch.turn_on: manual_override
      - lambda: |-
          if (id(maintenance_inhibit).state) {
            ESP_LOGW("pump_control", "Start rejected: maintenance inhibit active");
            return;
          }
          const int rpm = static_cast<int>(id(pump_target_rpm).state);
          id(g_requested_rpm) = rpm;
          id(g_run_requested) = true;
          id(pool_pump).request_speed(rpm);
          id(pool_pump).request_run(true);

  - platform: template
    name: Pump Stop
    on_press:
      - switch.turn_on: manual_override
      - lambda: |-
          id(g_run_requested) = false;
          id(pool_pump).request_run(false);

  - platform: restart
    name: Restart Controller
    id: restart_controller
    entity_category: diagnostic
    icon: mdi:restart

datetime:
  - platform: template
    type: time
    id: block1_start
    name: Schedule Block 1 Start
    optimistic: true
    initial_value: "08:00:00"
    restore_value: true

  - platform: template
    type: time
    id: block2_start
    name: Schedule Block 2 Start
    optimistic: true
    initial_value: "12:00:00"
    restore_value: true

  - platform: template
    type: time
    id: block3_start
    name: Schedule Block 3 Start
    optimistic: true
    initial_value: "18:00:00"
    restore_value: true

  - platform: template
    type: time
    id: block4_start
    name: Schedule Block 4 Start
    optimistic: true
    initial_value: "19:00:00"
    restore_value: true

  - platform: template
    type: time
    id: schedule_end_time
    name: Schedule End Time
    optimistic: true
    initial_value: "20:00:00"
    restore_value: true

number:
  - platform: template
    name: Set Pump RPM
    id: pump_target_rpm
    min_value: 600
    max_value: 3450
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 1500

  - platform: template
    name: Schedule Block 1 RPM
    id: block1_rpm
    min_value: 600
    max_value: 3450
    step: 50
    optimistic: true
    initial_value: 2350
    restore_value: true

  - platform: template
    name: Schedule Block 2 RPM
    id: block2_rpm
    min_value: 600
    max_value: 3450
    step: 50
    optimistic: true
    initial_value: 1450
    restore_value: true

  - platform: template
    name: Schedule Block 3 RPM
    id: block3_rpm
    min_value: 600
    max_value: 3450
    step: 50
    optimistic: true
    initial_value: 1000
    restore_value: true

  - platform: template
    name: Schedule Block 4 RPM
    id: block4_rpm
    min_value: 600
    max_value: 3450
    step: 50
    optimistic: true
    initial_value: 1000
    restore_value: true

interval:
  # Re-evaluate frequently so edits to the active schedule take effect promptly.
  - interval: 15s
    then:
      - lambda: |-
          if (id(maintenance_inhibit).state) {
            id(g_run_requested) = false;
            id(g_last_active_block) = -2;
            return;
          }
          if (id(manual_override).state) {
            ESP_LOGD("schedule", "Manual override active, skipping schedule check");
            return;
          }
          if (!id(schedule_master_enable).state) {
            id(g_run_requested) = false;
            if (id(g_last_active_block) != -1) {
              id(pool_pump).request_run(false);
              id(g_last_active_block) = -1;
            }
            return;
          }

          auto t = id(pool_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("schedule", "Time not yet synced, skipping check");
            return;
          }
          const int now_min = t.hour * 60 + t.minute;

          // Slots 0-3 are RPM blocks; slot 4 is the scheduled-off marker.
          bool enabled[5] = {
            id(block1_enabled).state, id(block2_enabled).state,
            id(block3_enabled).state, id(block4_enabled).state,
            id(schedule_end_enabled).state
          };
          int start_min[5] = {
            id(block1_start).hour * 60 + id(block1_start).minute,
            id(block2_start).hour * 60 + id(block2_start).minute,
            id(block3_start).hour * 60 + id(block3_start).minute,
            id(block4_start).hour * 60 + id(block4_start).minute,
            id(schedule_end_time).hour * 60 + id(schedule_end_time).minute
          };
          float rpm[4] = {
            id(block1_rpm).state, id(block2_rpm).state,
            id(block3_rpm).state, id(block4_rpm).state
          };

          int active = -1;
          int best_start = -1;
          for (int i = 0; i < 5; i++) {
            if (enabled[i] && start_min[i] <= now_min && start_min[i] > best_start) {
              best_start = start_min[i];
              active = i;
            }
          }

          if (active == -1 || active == 4) {
            id(g_run_requested) = false;
            if (id(g_last_active_block) != -1) {
              id(pool_pump).request_run(false);
              id(g_last_active_block) = -1;
            }
            return;
          }

          const int requested_rpm = static_cast<int>(rpm[active]);
          const bool block_changed = id(g_last_active_block) != active;
          const bool rpm_changed = id(g_requested_rpm) != requested_rpm;
          if (block_changed || rpm_changed) {
            ESP_LOGI("schedule", "Applying block %d at %d RPM", active + 1, requested_rpm);
            id(g_requested_rpm) = requested_rpm;
            id(g_run_requested) = true;
            id(pool_pump).request_speed(requested_rpm);
            id(pool_pump).request_run(true);
            id(g_last_active_block) = active;
          }

display:
  - platform: lcd_pcf8574
    id: controller_lcd
    i2c_id: display_bus
    dimensions: 20x4
    address: 0x27
    update_interval: 1s
    lambda: |-
      char ip_address[network::IP_ADDRESS_BUFFER_SIZE] = "Not connected";
      for (const auto &address : wifi::global_wifi_component->get_ip_addresses()) {
        if (address.is_set() && address.is_ip4()) {
          address.str_to(ip_address);
          break;
        }
      }
      const bool show_ip = (millis() / 5000) % 2 == 0;

      if (id(maintenance_inhibit).state) {
        it.print(0, 0, "MAINTENANCE ACTIVE");
        it.print(0, 1, "Pump forced STOP");

        if (id(pump_motor_rpm).has_state() && id(pump_input_power).has_state()) {
          it.printf(0, 2, "RPM:%4.0f Power:%4.0f", id(pump_motor_rpm).state,
                    id(pump_input_power).state);
        } else {
          it.print(0, 2, "Waiting for pump...");
        }
        if (show_ip) {
          it.printf(0, 3, "IP:%-17.17s", ip_address);
        } else {
          it.print(0, 3, "Release stays OFF");
        }
        return;
      }

      const char *status = id(pump_status).has_state()
                               ? id(pump_status).state.c_str()
                               : "No communication";
      it.printf(0, 0, "Pump: %-14.14s", status);

      if (id(pump_motor_rpm).has_state()) {
        it.printf(0, 1, "RPM:%4.0f Set:%4.0f", id(pump_motor_rpm).state,
                  static_cast<float>(id(g_requested_rpm)));
      } else {
        it.printf(0, 1, "RPM:---- Set:%4d", id(g_requested_rpm));
      }

      if (id(pump_input_power).has_state() && id(pump_motor_current).has_state()) {
        it.printf(0, 2, "Power:%4.0fW I:%4.1fA", id(pump_input_power).state,
                  id(pump_motor_current).state);
      } else {
        it.print(0, 2, "Power:----W I:----A");
      }

      if (show_ip) {
        it.printf(0, 3, "IP:%-17.17s", ip_address);
      } else if (id(pump_fault_code).has_state() && id(pump_fault_code).state != 0) {
        it.printf(0, 3, "Fault: 0x%02X", static_cast<unsigned int>(id(pump_fault_code).state));
      } else if (id(manual_override).state) {
        it.print(0, 3, "Mode: MANUAL");
      } else if (id(g_last_active_block) >= 0 && id(g_last_active_block) < 4) {
        it.printf(0, 3, "Schedule: Block %d", id(g_last_active_block) + 1);
      } else if (id(g_last_active_block) == -1) {
        it.print(0, 3, "Schedule: OFF");
      } else {
        it.print(0, 3, "Schedule: waiting");
      }
